
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Francés - Repaso inteligente</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  font-family: system-ui, sans-serif;
  background: #f3f4f6;
  min-height: 100vh;
  margin: 0;
  padding: 16px;
  display: grid;
  place-items: center;
}

main {
  width: 100%;
  max-width: 440px;
  background: white;
  padding: 28px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 6px 25px #00000012;
}

h1 { font-size: 32px; margin: 24px 0; }

input, button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 18px;
  border-radius: 10px;
}

input { border: 1px solid #d1d5db; }

button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}

button:disabled { cursor: default; }

#opciones button {
  background: #e5e7eb;
  color: #111827;
}

#mensaje {
  min-height: 25px;
  font-weight: 500;
}

#progreso, #estadisticas {
  color: #6b7280;
  font-size: 14px;
}

.barra {
  height: 8px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
}

#barraProgreso {
  height: 100%;
  width: 0;
  background: #2563eb;
  transition: width .3s;
}

.secundario { background: #64748b; }
</style>
</head>

<body>
<main>
  <p id="progreso">Cargando palabras...</p>

  <div class="barra">
    <div id="barraProgreso"></div>
  </div>

  <h1 id="pregunta"></h1>

  <input
    id="respuesta"
    placeholder="Escribe en francés"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
  >

  <button id="comprobar">Comprobar</button>

  <div id="opciones" hidden></div>

  <p id="mensaje"></p>
  <p id="estadisticas"></p>

  <button id="reiniciar" class="secundario" hidden>
    Nueva sesión
  </button>
</main>

<script>
// CONFIGURACIÓN
const PREGUNTAS_POR_SESION = 50;
const CLAVE_MEMORIA = "frances_memoria_v1";

// VARIABLES
let palabras = [];
let memoria = {};
let actual = null;
let anterior = null;
let indice = 0;
let errores = 0;
let aciertosDirectos = 0;
let bloqueado = false;
let modoOpciones = false;
let fallada = false;
let temporizador = null;

const pregunta = document.getElementById("pregunta");
const input = document.getElementById("respuesta");
const mensaje = document.getElementById("mensaje");
const progreso = document.getElementById("progreso");
const boton = document.getElementById("comprobar");
const opcionesDiv = document.getElementById("opciones");
const estadisticas = document.getElementById("estadisticas");
const barra = document.getElementById("barraProgreso");
const reiniciar = document.getElementById("reiniciar");

// NORMALIZAR PALABRAS
function normalizar(texto) {
  return texto.trim().toLocaleLowerCase("fr")
    .normalize("NFC");
}

// IDENTIFICADOR DE CADA PALABRA
function clave(p) {
  return JSON.stringify([
    normalizar(p.espanol),
    normalizar(p.frances)
  ]);
}

// CARGAR MEMORIA
function cargarMemoria() {
  try {
    memoria = JSON.parse(
      localStorage.getItem(CLAVE_MEMORIA)
    ) || {};
  } catch {
    memoria = {};
  }
}

// GUARDAR MEMORIA
function guardarMemoria() {
  try {
    localStorage.setItem(
      CLAVE_MEMORIA,
      JSON.stringify(memoria)
    );
  } catch (e) {
    console.warn("No se pudo guardar el progreso", e);
  }
}

// OBTENER ESTADÍSTICAS DE UNA PALABRA
function obtenerDatos(p) {
  const id = clave(p);

  if (!memoria[id]) {
    memoria[id] = {
      dominio: 0,
      aciertos: 0,
      fallos: 0
    };
  }

  return memoria[id];
}

// MEZCLAR
function mezclar(lista) {
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lista[i], lista[j]] = [lista[j], lista[i]];
  }
  return lista;
}

// LEER CSV
async function cargarCSV() {
  try {
    const res = await fetch("palabras.csv", {
      cache: "no-store"
    });

    if (!res.ok) {
      throw new Error("No se encuentra palabras.csv");
    }

    const texto = (await res.text())
      .replace(/^\uFEFF/, "");

    const lineas = texto.split(/\r?\n/)
      .map(l => l.trim())
      .filter(Boolean);

    // Detectar cabecera opcional
    if (
      lineas[0] &&
      /^(espanol|español)\s*,\s*(frances|francés)$/i
        .test(lineas[0])
    ) {
      lineas.shift();
    }

    palabras = lineas.map(linea => {
      const partes = linea.split(",");
      if (partes.length !== 2) return null;

      return {
        espanol: partes[0].trim(),
        frances: partes[1].trim()
      };
    }).filter(p => p && p.espanol && p.frances);

    // Eliminar filas duplicadas
    palabras = [
      ...new Map(
        palabras.map(p => [clave(p), p])
      ).values()
    ];

    if (!palabras.length) {
      throw new Error("El CSV no tiene palabras válidas");
    }

    cargarMemoria();
    iniciarSesion();

  } catch (e) {
    progreso.textContent = "Error";
    mensaje.textContent = e.message;
    input.hidden = true;
    boton.hidden = true;
  }
}

// PESO: MENOS DOMINIO = MÁS PROBABILIDAD
function calcularPeso(p) {
  const datos = obtenerDatos(p);

  // Una palabra dominada sigue pudiendo aparecer.
  const pesos = [12, 8, 5, 3, 2, 1];

  const dominio = Math.max(
    0, Math.min(5, datos.dominio)
  );

  return pesos[dominio];
}

// ELEGIR PALABRA SEGÚN SU PESO
function elegirPalabra() {
  // Evita repetir inmediatamente si hay alternativas.
  const candidatas = palabras.length > 1
    ? palabras.filter(p => clave(p) !== anterior)
    : palabras;

  const total = candidatas.reduce(
    (suma, p) => suma + calcularPeso(p), 0
  );

  let azar = Math.random() * total;

  for (const p of candidatas) {
    azar -= calcularPeso(p);
    if (azar < 0) return p;
  }

  return candidatas[candidatas.length - 1];
}

// INICIAR SESIÓN
function iniciarSesion() {
  clearTimeout(temporizador);
  indice = 0;
  errores = 0;
  aciertosDirectos = 0;
  anterior = null;

  reiniciar.hidden = true;
  input.hidden = false;
  boton.hidden = false;

  mostrar();
}

// MOSTRAR PREGUNTA
function mostrar() {
  if (indice >= PREGUNTAS_POR_SESION) {
    finalizar();
    return;
  }

  actual = elegirPalabra();
  anterior = clave(actual);
  bloqueado = false;
  modoOpciones = false;
  fallada = false;

  pregunta.textContent = actual.espanol;
  progreso.textContent =
    `Pregunta ${indice + 1} de ${PREGUNTAS_POR_SESION}`;

  barra.style.width =
    `${indice / PREGUNTAS_POR_SESION * 100}%`;

  input.hidden = false;
  boton.hidden = false;
  input.value = "";
  opcionesDiv.hidden = true;
  opcionesDiv.innerHTML = "";
  mensaje.textContent = "";

  actualizarEstadisticas();
  input.focus();
}

// ACTUALIZAR CONTADORES
function actualizarEstadisticas() {
  estadisticas.textContent =
    `Aciertos directos: ${aciertosDirectos} | Errores: ${errores}`;
}

// RESPUESTA CORRECTA
function acertar(directo) {
  bloqueado = true;
  const datos = obtenerDatos(actual);

  datos.aciertos++;

  if (directo && !fallada) {
    datos.dominio = Math.min(5, datos.dominio + 1);
    aciertosDirectos++;
  }

  // Una respuesta por opciones no aumenta el dominio.
  guardarMemoria();

  mensaje.textContent = "✅ ¡Correcto!";
  mensaje.style.color = "green";

  indice++;
  actualizarEstadisticas();
  temporizador = setTimeout(mostrar, 650);
}

// REGISTRAR FALLO
function registrarFallo() {
  errores++;
  const datos = obtenerDatos(actual);

  datos.fallos++;
  datos.dominio = Math.max(0, datos.dominio - 1);

  guardarMemoria();
  actualizarEstadisticas();
}

// COMPROBAR RESPUESTA ESCRITA
function comprobar() {
  if (bloqueado || modoOpciones || !actual) return;

  const respuesta = normalizar(input.value);
  if (!respuesta) return;

  if (respuesta === normalizar(actual.frances)) {
    acertar(true);
  } else {
    fallada = true;
    registrarFallo();
    mostrarOpciones();
  }
}

// MOSTRAR 3 OPCIONES
function mostrarOpciones() {
  modoOpciones = true;
  input.hidden = true;
  boton.hidden = true;

  mensaje.textContent =
    "❌ Incorrecto. Elige la respuesta:";
  mensaje.style.color = "#dc2626";

  const correcta = actual.frances;

  const incorrectas = [
    ...new Map(
      palabras
        .filter(p =>
          normalizar(p.frances) !== normalizar(correcta)
        )
        .map(p => [normalizar(p.frances), p.frances])
    ).values()
  ];

  mezclar(incorrectas);

  const opciones = mezclar([
    correcta,
    ...incorrectas.slice(0, 2)
  ]);

  opcionesDiv.innerHTML = "";
  opcionesDiv.hidden = false;

  opciones.forEach(opcion => {
    const b = document.createElement("button");
    b.textContent = opcion;

    b.onclick = () => {
      if (bloqueado) return;

      if (normalizar(opcion) === normalizar(correcta)) {
        b.style.background = "#bbf7d0";
        acertar(false);
      } else {
        registrarFallo();
        b.disabled = true;
        b.style.background = "#fecaca";
        mensaje.textContent =
          "❌ Prueba otra opción.";
      }
    };

    opcionesDiv.appendChild(b);
  });
}

// FINALIZAR
function finalizar() {
  bloqueado = true;

  pregunta.textContent = "¡Sesión terminada! 🎉";
  progreso.textContent =
    `${PREGUNTAS_POR_SESION} preguntas completadas`;

  barra.style.width = "100%";

  input.hidden = true;
  boton.hidden = true;
  opcionesDiv.hidden = true;

  mensaje.textContent =
    `Aciertos sin ayuda: ${aciertosDirectos} / ${PREGUNTAS_POR_SESION}`;

  mensaje.style.color = "#111827";

  actualizarEstadisticas();
  reiniciar.hidden = false;
}

// EVENTOS
boton.addEventListener("click", comprobar);

input.addEventListener("keydown", e => {
  if (e.key === "Enter") comprobar();
});

reiniciar.addEventListener("click", iniciarSesion);

// INICIAR
cargarCSV();
</script>
</body>
</html>
